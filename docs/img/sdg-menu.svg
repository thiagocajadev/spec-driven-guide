<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="title">
  <title id="title">The spec-driven-guide menu in a terminal: install the guide, settings, exit</title>
  <rect width="600" height="330" rx="12" fill="#1e2127"/>
  <rect width="600" height="34" rx="12" fill="#23272f"/>
  <rect y="22" width="600" height="12" fill="#23272f"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="6" fill="#febc2e"/>
  <circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text x="300" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7f848e">npx spec-driven-guide</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#d7dae0">
    <text x="38" y="70"><tspan font-weight="700">Spec-Driven Guide</tspan></text>
    <text x="38" y="92" fill="#3fd49b">──────────────────────────────────────────────────</text>
    <text x="38" y="114">Your spec guide for developers and agents.</text>
    <text x="38" y="136" fill="#7f848e">Press Ctrl+C to exit.</text>
    <text x="20" y="180"><tspan fill="#61afef">?</tspan> <tspan font-weight="700">What would you like to do?</tspan></text>
    <text x="20" y="202" fill="#56b6c2">❯ 1. 🏗️  Install the guide: protocol, skills and backlog</text>
    <text x="38" y="224">2. ⚙️  Settings: audit, update and maintenance</text>
    <text x="38" y="246">3. ❌ Exit</text>
    <text x="20" y="290"><tspan font-weight="700">↑↓</tspan> <tspan fill="#7f848e">navigate •</tspan> <tspan font-weight="700">⏎</tspan> <tspan fill="#7f848e">select</tspan></text>
  </g>
</svg>
